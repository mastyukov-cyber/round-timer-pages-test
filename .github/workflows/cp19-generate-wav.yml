name: CP19 isolated WAV conversion (one-time, TEST branch only)
on:
  push:
    branches: [assistant/round-timer-cp19-four-audio-20261117]
    paths:
      - '.github/workflows/cp19-generate-wav.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Guard environment and original MP3
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mastyukov-cyber/round-timer-pages-test"
          test "$GITHUB_REF_NAME" = "assistant/round-timer-cp19-four-audio-20261117"
          command -v ffmpeg
          command -v ffprobe
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(readFileSync('studio-audio-manifest.json','utf8'));
          if(m.files.length!==5) throw Error('Five approved MP3 required');
          for(const item of m.files){
            const b=readFileSync('sounds/'+item.name);
            if(b.length!==item.bytes||createHash('sha256').update(b).digest('hex')!==item.sha256)
              throw Error('Original approved MP3 mismatch: '+item.name);
          }
          console.log('PASS: five MP3 unchanged');
          JS
      - name: Convert approved MP3 to PCM16 WAV, preserve original files
        run: |
          set -euo pipefail
          mkdir -p sounds/cp19-wav
          for name in button studio-gong-start studio-gong-end woodclack-single woodclack-double; do
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "sounds/$name.mp3" -vn -map_metadata -1 -c:a pcm_s16le -ar 48000 "sounds/cp19-wav/$name.wav"
            test -s "sounds/cp19-wav/$name.wav"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 "sounds/cp19-wav/$name.wav"
          done
          du -h sounds/cp19-wav/*.wav
      - name: Commit new WAV only to isolated TEST branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/cp19-wav/*.wav
          git diff --cached --quiet && { echo 'ERROR: no new WAV assets'; exit 1; }
          git diff --cached --name-only | grep -v '^sounds/cp19-wav/.*\.wav$' && exit 1 || true
          git commit -m 'assets(CP19): isolated PCM WAV copies of five approved MP3'
          git push origin HEAD:refs/heads/assistant/round-timer-cp19-four-audio-20261117
