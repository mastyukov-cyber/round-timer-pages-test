name: Round Timer test PWA diagnostics regression
on:
  push:
    branches: [main]
    paths:
      - 'app.mjs'
      - 'sw.js'
      - 'diagnostics/**'
      - 'tests/**'
      - '.github/workflows/qa-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          set -euo pipefail
          node --check app.mjs
          node --check engine.mjs
          node --check sw.js
          node --check diagnostics/schema.mjs
          node --check diagnostics/sender.mjs
      - name: Verify preserved UI and error-only telemetry
        run: node --test tests/diagnostics-smoke.test.mjs
