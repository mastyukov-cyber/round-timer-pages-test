name: Round Timer test PWA HTML Audio RC4 (no deploy / secrets)
on:
  push:
    branches: [main]
    paths:
      - 'app.mjs'
      - 'audio-guard.mjs'
      - 'html-audio.mjs'
      - 'sw.js'
      - 'index.html'
      - 'preview-build.json'
      - 'diagnostics/**'
      - 'tests/**'
      - '.github/workflows/qa-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and required assets
        run: |
          set -euo pipefail
          for f in index.html app.mjs audio-guard.mjs html-audio.mjs engine.mjs sw.js diagnostics/schema.mjs diagnostics/sender.mjs privacy.html preview-build.json; do test -s "$f"; done
          for f in app.mjs audio-guard.mjs html-audio.mjs engine.mjs sw.js diagnostics/schema.mjs diagnostics/sender.mjs; do node --check "$f"; done
      - name: Preview-only smoke, audio pause/background and origin safety
        run: node --test tests/*.test.mjs
