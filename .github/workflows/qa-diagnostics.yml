name: APP-001 RC12 QA — iPhone audio timing, original MP3 hashes and offline
on:
  push:
    branches: [main]
    paths:
      - 'app.mjs'
      - 'engine.mjs'
      - 'styles.css'
      - 'studio-audio-manifest.json'
      - 'sounds/**'
      - 'audio-guard.mjs'
      - 'html-audio.mjs'
      - 'web-audio-retire.mjs'
      - 'audio-duck.mjs'
      - 'sw.js'
      - 'index.html'
      - 'preview-build.json'
      - 'diagnostics/**'
      - 'tests/**'
      - '.github/workflows/qa-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and required assets
        run: |
          set -euo pipefail
          for f in index.html app.mjs audio-guard.mjs html-audio.mjs web-audio-retire.mjs audio-duck.mjs engine.mjs styles.css sw.js diagnostics/schema.mjs diagnostics/sender.mjs privacy.html preview-build.json studio-audio-manifest.json sounds/button.mp3 sounds/studio-gong-start.mp3 sounds/studio-gong-end.mp3 sounds/woodclack-single.mp3 sounds/woodclack-double.mp3; do test -s "$f"; done
          for f in app.mjs audio-guard.mjs html-audio.mjs web-audio-retire.mjs audio-duck.mjs engine.mjs sw.js diagnostics/schema.mjs diagnostics/sender.mjs; do node --check "$f"; done
      - name: Preview-only smoke, audio pause/background and origin safety
        run: node --test tests/*.test.mjs

# Safe re-trigger after GitHub Actions reported failed runs with zero jobs (2026-11-09).
